<!DOCTYPE html>
<html>

<head>
    <title>Smart Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <div class="dashboard">
        {% for app in apps %}
        <div class="app" tabindex="0" data-app="{{ app.name }}">
            <img src="/static/{{ app.icon }}" alt="{{ app.name }}">
        </div>
        {% endfor %}
    </div>

    <script>
        function launchApp(appName) {
            fetch(`/launch?app=${encodeURIComponent(appName)}`)
                .then(res => res.json())
                .then(data => console.log(data));
        }

        document.addEventListener("DOMContentLoaded", () => {

            // Function to hide the cursor
            function hideCursor() {
                document.body.classList.add("hidden-cursor");
            }

            // Function to show the cursor
            function showCursor() {
                document.body.classList.remove("hidden-cursor");
            }

            // Hide the cursor after 5 seconds
            setTimeout(hideCursor, 5000);

            // Show the cursor when the mouse is moved
            document.addEventListener("mousemove", function() {
                showCursor();
                // Optionally, you can reset the timer to hide the cursor again after another 5 seconds
                setTimeout(hideCursor, 5000);
            });

            const apps = document.querySelectorAll('.app');

            // Optional: arrow key navigation
            let focusedIndex = 0;
            apps[focusedIndex].focus();

            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowRight') {
                    focusedIndex = (focusedIndex + 1) % apps.length;
                    apps[focusedIndex].focus();
                } else if (e.key === 'ArrowLeft') {
                    focusedIndex = (focusedIndex - 1 + apps.length) % apps.length;
                    apps[focusedIndex].focus();
                } else if (e.key === 'Enter') {
                    const focused = document.activeElement;
                    if (focused.classList.contains('app')) {
                        launchApp(focused.dataset.app);
                    }
                }
            });

            // Allow mouse click to also trigger
            apps.forEach(app => {
                app.addEventListener('click', () => launchApp(app.dataset.app));
            });
        });

        // Configuration
        const xMinutes = 5; // Change this number to set your desired interval time
        const backgrounds = [
            '0188.jpg',
            '0277.jpg',
            '0309.jpg',
            '0327.jpg',
            'color-splash-3.jpg',
            '0016.jpg',
            '0018.jpg',
            '0072.jpg',
            '0078.jpg',
            '0105.jpg',
            '0123.jpg',
            '0199.jpg',
            '0235.jpg'
        ];

        function setRandomBackground() {
            if (backgrounds.length === 0) return;

            // Get a random index
            const randomIndex = Math.floor(Math.random() * backgrounds.length);
            const randomImage = backgrounds[randomIndex];
            
            // Apply styles
            document.body.style.backgroundImage = `url('/static/backgrounds/${randomImage}')`;
            document.body.style.backgroundSize = 'cover';
            document.body.style.backgroundPosition = 'center';
            document.body.style.backgroundRepeat = 'no-repeat';
            document.body.style.backgroundAttachment = 'fixed';
        }

        // Set background immediately on load
        setRandomBackground();

        // Set up the interval to run every X minutes
        // Multiply minutes by 60 seconds, then by 1000 milliseconds
        const intervalMs = xMinutes * 60 * 1000;

        const backgroundInterval = setInterval(setRandomBackground, intervalMs);

        // Optional: Log when the change happens for debugging
        console.log(`Background will update every ${xMinutes} minutes`);
    </script>
</body>

</html>
