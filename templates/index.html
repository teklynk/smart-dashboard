<!DOCTYPE html>
<html>

<head>
    <title>Smart Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <div id="clock-container">
        <div id="time"></div>
        <div id="date"></div>
    </div>
    <div class="dashboard">
        {% for app in apps %}
        <div class="app" tabindex="0" data-app="{{ app.name }}">
            <img src="/static/{{ app.icon }}" alt="{{ app.name }}">
        </div>
        {% endfor %}
    </div>

    <script>
        function launchApp(appName) {
            fetch(`/launch?app=${encodeURIComponent(appName)}`)
                .then(res => res.json())
                .then(data => console.log(data));
        }

        document.addEventListener("DOMContentLoaded", () => {

            // Function to hide the cursor
            function hideCursor() {
                document.body.classList.add("hidden-cursor");
            }

            // Function to show the cursor
            function showCursor() {
                document.body.classList.remove("hidden-cursor");
            }

            // Hide the cursor after 5 seconds
            setTimeout(hideCursor, 5000);

            // Show the cursor when the mouse is moved
            document.addEventListener("mousemove", function() {
                showCursor();
                // Optionally, you can reset the timer to hide the cursor again after another 5 seconds
                setTimeout(hideCursor, 5000);
            });

            const apps = document.querySelectorAll('.app');

            // Optional: arrow key navigation
            let focusedIndex = 0;
            apps[focusedIndex].focus();

            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowRight') {
                    focusedIndex = (focusedIndex + 1) % apps.length;
                    apps[focusedIndex].focus();
                } else if (e.key === 'ArrowLeft') {
                    focusedIndex = (focusedIndex - 1 + apps.length) % apps.length;
                    apps[focusedIndex].focus();
                } else if (e.key === 'Enter') {
                    const focused = document.activeElement;
                    if (focused.classList.contains('app')) {
                        launchApp(focused.dataset.app);
                    }
                }
            });

            // Allow mouse click to also trigger
            apps.forEach(app => {
                app.addEventListener('click', () => launchApp(app.dataset.app));
            });
        });

        // Configuration
        const xMinutes = 5; // Change this number to set your desired interval time
        const backgrounds = [
            '0188.jpg',
            '0277.jpg',
            '0309.jpg',
            '0327.jpg',
            'color-splash-3.jpg',
            '0016.jpg',
            '0018.jpg',
            '0072.jpg',
            '0078.jpg',
            '0105.jpg',
            '0123.jpg',
            '0199.jpg',
            '0235.jpg'
        ];

        function setRandomBackground() {
            if (backgrounds.length === 0) return;

            // Get a random index
            const randomIndex = Math.floor(Math.random() * backgrounds.length);
            const randomImage = backgrounds[randomIndex];
            
            // Apply styles
            document.body.style.backgroundImage = `url('/static/backgrounds/${randomImage}')`;
            document.body.style.backgroundSize = 'cover';
            document.body.style.backgroundPosition = 'center';
            document.body.style.backgroundRepeat = 'no-repeat';
            document.body.style.backgroundAttachment = 'fixed';
        }

        // Set background immediately on load
        setRandomBackground();

        // Set up the interval to run every X minutes
        // Multiply minutes by 60 seconds, then by 1000 milliseconds
        const intervalMs = xMinutes * 60 * 1000;

        const backgroundInterval = setInterval(setRandomBackground, intervalMs);

        // Optional: Log when the change happens for debugging
        console.log(`Background will update every ${xMinutes} minutes`);

        function updateClock() {
            const now = new Date();
            
            // Time Components
            let hours = now.getHours();
            const minutes = now.getMinutes();
            
            // Determine AM or PM
            const ampm = hours >= 12 ? 'PM' : 'AM';
            
            // Convert to 12-hour format
            hours = hours % 12;
            hours = hours ? hours : 12; // Handle midnight case (0 -> 12)
            
            // Add leading zeros
            const strHours = hours < 10 ? '' + hours : hours;
            const strMinutes = minutes < 10 ? '0' + minutes : minutes;
            
            // Format Time String
            document.getElementById('time').innerText = `${strHours}:${strMinutes} ${ampm}`;
            
            // Date Components
            const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            const months = ['January', 'February', 'March', 'April', 'May', 'June', 
                            'July', 'August', 'September', 'October', 'November', 'December'];
            
            const dayName = days[now.getDay()];
            const monthName = months[now.getMonth()];
            const dateNum = now.getDate();
            const year = now.getFullYear();
            
            // Format Date String
            document.getElementById('date').innerText = `${dayName}, ${monthName} ${dateNum}, ${year}`;
        }

        // Update immediately, then every second
        updateClock();
        setInterval(updateClock, 1000);
    </script>
</body>

</html>
