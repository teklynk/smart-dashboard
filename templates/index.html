<!DOCTYPE html>
<html>

<head>
    <title>Smart Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <div id="background-layer"></div>
    <div class="upper-info-bar">
        <div class="tools-toolbar">
            {% for tool in tools %}
            <button class="tool-btn {% if tool.requires_confirmation %}destructive{% endif %}"
                onclick="launchTool('{{ tool.id }}', {{ tool.requires_confirmation|lower }})" title="{{ tool.name }}">
                <img src="/static/{{ tool.icon }}" alt="{{ tool.name }}" />
            </button>
            {% endfor %}
        </div>
        <div id="clock-container">
            <p id="time">--</p>
            <p id="date">--</p>
        </div>

        <div id="weather">
            <img id="icon" src="data:image/gif;base64,R0lGODlhAQABAIAAAP///wAAACH5BAEAAAAALAAAAAABAAEAAAICRAEAOw=="
                alt="">
            <div>
                <p id="location">Loading weather...</p>
                <p class="temp" id="temp">--</p>
                <p class="desc" id="desc">--</p>
            </div>
        </div>
    </div>
    <div class="dashboard">
        {% for app in apps %}
        <div class="app" tabindex="0" data-app="{{ app.name }}">
            <img src="/static/{{ app.icon }}" alt="{{ app.name }}">
        </div>
        {% endfor %}
    </div>

    <div id="confirm-modal" class="confirm-modal hidden">
        <div class="confirm-modal-backdrop"></div>
        <div class="confirm-modal-content">
            <p id="confirm-modal-message">Are you sure?</p>
            <div class="confirm-modal-actions">
                <button id="confirm-modal-no">Cancel</button>
                <button id="confirm-modal-yes">Yes</button>
            </div>
        </div>
    </div>

    <script>
        function launchApp(appName) {
            fetch(`/launch?app=${encodeURIComponent(appName)}`)
                .then(res => res.json())
                .then(data => console.log(data));
        }

        document.addEventListener("DOMContentLoaded", () => {

            // Function to hide the cursor
            function hideCursor() {
                document.body.classList.add("hidden-cursor");
            }

            // Function to show the cursor
            function showCursor() {
                document.body.classList.remove("hidden-cursor");
            }

            // Hide the cursor after 5 seconds
            setTimeout(hideCursor, 5000);

            // Show the cursor when the mouse is moved
            document.addEventListener("mousemove", function () {
                showCursor();
                // Optionally, you can reset the timer to hide the cursor again after another 5 seconds
                setTimeout(hideCursor, 5000);
            });

            const apps = document.querySelectorAll('.app');

            // Optional: arrow key navigation
            let focusedIndex = 0;
            apps[focusedIndex].focus();

            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowRight') {
                    focusedIndex = (focusedIndex + 1) % apps.length;
                    apps[focusedIndex].focus();
                } else if (e.key === 'ArrowLeft') {
                    focusedIndex = (focusedIndex - 1 + apps.length) % apps.length;
                    apps[focusedIndex].focus();
                } else if (e.key === 'Enter') {
                    const focused = document.activeElement;
                    if (focused.classList.contains('app')) {
                        launchApp(focused.dataset.app);
                    }
                }
            });

            // Allow mouse click to also trigger
            apps.forEach(app => {
                app.addEventListener('click', () => launchApp(app.dataset.app));
            });

            // Audio click sounds
            const focusSound = new Audio('/static/sounds/click.mp3');

            // Reduce latency by preloading
            focusSound.preload = 'auto';

            const dashboard = document.querySelector('.dashboard');

            if (dashboard) {
                // Add a single 'focusin' listener to the parent
                dashboard.addEventListener('focusin', (event) => {
                    // Check if the focused element (or its parent) is an app
                    const app = event.target.closest('.app');

                    if (app && dashboard.contains(app)) {
                        // Reset time to 0 to allow rapid re-triggering
                        focusSound.currentTime = 0;

                        // Play the sound
                        focusSound.play().catch(error => {
                            console.log("Audio play blocked by browser until user interaction:", error);
                        });
                    }
                });
            }
        });

        // Injected from Flask via backgrounds.json
        let backgrounds = {{ backgrounds | tojson }};

        // Fisher-Yates shuffle algorithm (in-place shuffle)
        function shuffleArray(array) {
            const shuffled = [...array]; // Create a copy so we don't mutate original
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        // Shuffle backgrounds on page load for variety
        backgrounds = shuffleArray(backgrounds);
        console.log(`Backgrounds shuffled: ${backgrounds.length} images loaded`);

        let lastIndex = -1;

        function setRandomBackground() {
            if (backgrounds.length === 0) return;

            // Pick a random index different from the last one
            let randomIndex;
            do {
                randomIndex = Math.floor(Math.random() * backgrounds.length);
            } while (backgrounds.length > 1 && randomIndex === lastIndex);

            lastIndex = randomIndex;
            const imgSrc = `/static/backgrounds/${backgrounds[randomIndex]}`;

            const layer = document.getElementById('background-layer');
            const newImg = document.createElement('img');
            newImg.src = imgSrc;
            newImg.alt = '';

            newImg.onload = () => {
                layer.insertBefore(newImg, layer.firstChild);
                requestAnimationFrame(() => {
                    newImg.classList.add('active');

                    // Fade out any previously active images
                    const oldImages = layer.querySelectorAll('img.active');
                    oldImages.forEach(img => {
                        if (img !== newImg) {
                            img.classList.remove('active');
                            setTimeout(() => img.remove(), 2000);
                        }
                    });
                });
            };
        }

        // Load the FIRST shuffled background on page load
        setRandomBackground();

        // Crossfade every X minutes
        const xMinutes = 5;
        const intervalMs = xMinutes * 60 * 1000;
        setInterval(setRandomBackground, intervalMs);
        console.log(`Background will crossfade every ${xMinutes} minutes`);

        function updateClock() {
            const now = new Date();

            // Time Components
            let hours = now.getHours();
            const minutes = now.getMinutes();

            // Determine AM or PM
            const ampm = hours >= 12 ? 'PM' : 'AM';

            // Convert to 12-hour format
            hours = hours % 12;
            hours = hours ? hours : 12; // Handle midnight case (0 -> 12)

            // Add leading zeros
            const strHours = hours < 10 ? '' + hours : hours;
            const strMinutes = minutes < 10 ? '0' + minutes : minutes;

            // Format Time String
            document.getElementById('time').innerText = `${strHours}:${strMinutes} ${ampm}`;

            // Date Components
            const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            const months = ['January', 'February', 'March', 'April', 'May', 'June',
                'July', 'August', 'September', 'October', 'November', 'December'];

            const dayName = days[now.getDay()];
            const monthName = months[now.getMonth()];
            const dateNum = now.getDate();
            const year = now.getFullYear();

            // Format Date String
            document.getElementById('date').innerText = `${dayName}, ${monthName} ${dateNum}, ${year}`;
        }

        // Update immediately, then every second
        updateClock();
        setInterval(updateClock, 1000);

        // Injected from Flask via weather.json
        const CONFIG = {{ weather | tojson }};

        const API_URL = 'https://api.openweathermap.org/data/2.5/weather';

        async function fetchWeather() {
            const weatherEl = document.getElementById('weather');

            // Hide if config is missing or empty
            if (!CONFIG.zipCode || !CONFIG.apiKey || CONFIG.apiKey === 'YOUR_API_KEY') {
                weatherEl.style.display = 'none';
                return;
            }

            try {
                const res = await fetch(
                    `${API_URL}?zip=${CONFIG.zipCode}&units=${CONFIG.units}&appid=${CONFIG.apiKey}`
                );

                if (!res.ok) {
                    const errData = await res.json().catch(() => ({}));
                    throw new Error(errData.message || `HTTP ${res.status}`);
                }

                const data = await res.json();

                document.getElementById('location').textContent = data.name;
                document.getElementById('icon').src =
                    `https://openweathermap.org/img/wn/${data.weather[0].icon}@2x.png`;
                document.getElementById('icon').alt = data.weather[0].description;
                document.getElementById('temp').textContent =
                    `${Math.round(data.main.temp)}°`;
                document.getElementById('desc').textContent = data.weather[0].description;

                weatherEl.style.display = '';  // Ensure visible on success

            } catch (err) {
                console.error('Weather error:', err);
            }
        }

        // Fetch immediately, then every hour
        fetchWeather();
        setInterval(fetchWeather, 3600000);

        // Launch tools with confirmation for destructive actions
        function launchTool(toolId, requiresConfirmation) {
            if (requiresConfirmation) {
                const confirmed = window.confirm(
                    'Are you sure you want to perform this action?'
                );
                if (!confirmed) return;
            }

            fetch(`/tool?tool=${toolId}`)
                .then(res => res.json())
                .then(data => {
                    if (data.status === 'success') {
                        console.log('Tool executed successfully');
                    } else {
                        alert('Error: ' + (data.message || data.error));
                    }
                })
                .catch(err => {
                    alert('Request failed: ' + err);
                });
        }

        // Modal logic
        let pendingToolId = null;
        let modalKeydownHandler = null;
        let modalFocusinHandler = null;

        function showConfirmModal(message) {
            const modal = document.getElementById('confirm-modal');
            document.getElementById('confirm-modal-message').textContent = message;
            modal.classList.remove('hidden');

            const yes = document.getElementById('confirm-modal-yes');
            const no = document.getElementById('confirm-modal-no');

            yes.focus();

            modalKeydownHandler = function (event) {
                if (event.key !== 'Tab') return;

                const focusable = [no, yes];
                const currentIndex = focusable.indexOf(document.activeElement);
                let nextIndex = currentIndex;

                if (event.shiftKey) {
                    nextIndex = currentIndex <= 0 ? focusable.length - 1 : currentIndex - 1;
                } else {
                    nextIndex = currentIndex === focusable.length - 1 ? 0 : currentIndex + 1;
                }

                focusable[nextIndex].focus();
                event.preventDefault();
            };

            modalFocusinHandler = function (event) {
                if (!modal.contains(event.target)) {
                    yes.focus();
                }
            };

            document.addEventListener('keydown', modalKeydownHandler);
            document.addEventListener('focusin', modalFocusinHandler);
        }

        function hideConfirmModal() {
            const modal = document.getElementById('confirm-modal');
            modal.classList.add('hidden');
            pendingToolId = null;

            document.removeEventListener('keydown', modalKeydownHandler);
            document.removeEventListener('focusin', modalFocusinHandler);
            modalKeydownHandler = null;
            modalFocusinHandler = null;
        }

        function launchTool(toolId, requiresConfirmation) {
            if (requiresConfirmation) {
                pendingToolId = toolId;
                showConfirmModal('Are you sure you want to perform this action?');
                return;
            }

            sendToolRequest(toolId);
        }

        function sendToolRequest(toolId) {
            fetch(`/tool?tool=${toolId}`)
                .then(res => res.json())
                .then(data => {
                    if (data.status === 'success') {
                        console.log('Tool executed successfully');
                    } else {
                        alert('Error: ' + (data.message || data.error));
                    }
                })
                .catch(err => {
                    alert('Request failed: ' + err);
                });
        }

        document.getElementById('confirm-modal-yes').addEventListener('click', () => {
            if (pendingToolId) {
                sendToolRequest(pendingToolId);
            }
            hideConfirmModal();
        });

        document.getElementById('confirm-modal-no').addEventListener('click', hideConfirmModal);

        // Confirm dialog when closing the dashboard. Helps prevent accidentally closing the dashboard with alt+f4 or the close button.
        window.addEventListener('beforeunload', (event) => {
            event.preventDefault();
            event.returnValue = '';
            return '';
        });

        // Disable Right-Clicking
        document.addEventListener('contextmenu', (event) => {
            event.preventDefault();
        });
    </script>
</body>

</html>
